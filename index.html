<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f8f9fd" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0c1a" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon-180.png" />
    <!-- iOS 16.3 and earlier ignore the manifest's display mode. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="ajuba" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>ajuba scanner</title>
    <script>
      // Applied before first paint so a forced theme does not flash the other one.
      try {
        var t = localStorage.getItem('ajuba.theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
